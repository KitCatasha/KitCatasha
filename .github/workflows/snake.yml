name: Update contribution snake

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KitCatasha
          outputs: |
            snake/github-snake.svg?color_snake=#786A98
            snake/github-snake-dark.svg?palette=github-dark&color_snake=#B2A1C7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake/*.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update contribution snake"
          git pull --rebase
          git push
